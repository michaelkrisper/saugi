# Weekly updates of actions and dev tools; minor and patch bumps are grouped,
# majors arrive as separate pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
